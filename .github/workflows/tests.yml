# Runs the tests on every push and pull request. No Gemini key here, on purpose: every test runs without
# one (scripted fake Gemini, answer keys, the readings that ship with the app). The real-model evals cost
# quota and are run by hand (evals/run_eval.py).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest
        env:
          PYTHONIOENCODING: utf-8
